<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Observability Lab Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --primary: #38bdf8;
            --accent: #818cf8;
            --success: #4ade80;
            --warn: #fbbf24;
            --error: #f87171;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 2rem;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background-color: var(--card);
            border-radius: 0.75rem;
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        h2 { font-size: 1.1rem; margin-top: 0; color: var(--primary); }
        .stats { font-size: 2rem; font-weight: 600; margin: 0.5rem 0; }
        .label { font-size: 0.875rem; opacity: 0.7; }
        .badge {
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-live { background-color: var(--success); color: #064e3b; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>Observability Lab Dashboard</h1>
            <p class="label">System Performance & AI Metris Overview</p>
        </div>
        <span class="badge badge-live">● LIVE SYSTEM</span>
    </div>

    <div class="grid">
        <div class="card">
            <h2>Requests Tracking</h2>
            <canvas id="trafficChart"></canvas>
        </div>
        <div class="card">
            <h2>Latency (ms)</h2>
            <canvas id="latencyChart"></canvas>
        </div>
        <div class="card">
            <h2>Cost (USD)</h2>
            <div id="totalCost" class="stats">$0.00</div>
            <p class="label">Total Cumulative Spend</p>
        </div>
        <div class="card">
            <h2>Quality Proxy</h2>
            <canvas id="qualityChart"></canvas>
        </div>
        <div class="card">
            <h2>Token Distribution</h2>
            <canvas id="tokenChart"></canvas>
        </div>
        <div class="card">
            <h2>Error Distribution</h2>
            <canvas id="errorChart"></canvas>
        </div>
    </div>

    <script>
        const data = /* DATA_JSON */ {};
        
        // Traffic Chart
        new Chart(document.getElementById('trafficChart'), {
            type: 'line',
            data: {
                labels: data.timestamps,
                datasets: [{
                    label: 'Requests',
                    data: data.traffic,
                    borderColor: '#38bdf8',
                    tension: 0.4
                }]
            },
            options: { plugins: { legend: { display: false } } }
        });

        // Latency Chart
        new Chart(document.getElementById('latencyChart'), {
            type: 'bar',
            data: {
                labels: ['P50', 'P95', 'P99'],
                datasets: [{
                    data: [data.p50, data.p95, data.p99],
                    backgroundColor: ['#38bdf8', '#818cf8', '#f87171']
                }]
            }
        });

        // Total Cost
        document.getElementById('totalCost').innerText = `$${data.total_cost.toFixed(4)}`;

        // Token Chart (Input vs Output)
        new Chart(document.getElementById('tokenChart'), {
            type: 'doughnut',
            data: {
                labels: ['Input', 'Output'],
                datasets: [{
                    data: [data.tokens_in, data.tokens_out],
                    backgroundColor: ['#38bdf8', '#fbbf24']
                }]
            }
        });

        // Error Chart
        new Chart(document.getElementById('errorChart'), {
            type: 'pie',
            data: {
                labels: Object.keys(data.errors),
                datasets: [{
                    data: Object.values(data.errors),
                    backgroundColor: ['#f87171', '#fbbf24', '#818cf8']
                }]
            }
        });

        // Quality Chart
        new Chart(document.getElementById('qualityChart'), {
            type: 'line',
            data: {
                labels: data.timestamps,
                datasets: [{
                    label: 'Quality Score',
                    data: data.quality,
                    borderColor: '#4ade80',
                    fill: true,
                    backgroundColor: 'rgba(74, 222, 128, 0.1)'
                }]
            }
        });
    </script>
</body>
</html>
